name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Install, import & challenge-link tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Smoke test: a stranger cloning the repo must be able to install it.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # Catches syntax errors and missing imports in app.py.
      - name: Import smoke test
        run: python -c "import app; print('app.py imports cleanly')"

      - name: Run tests
        run: pytest tests/ -v
